<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - EventosQR</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #a855f7;
    }

    .logout {
      background: #a855f7;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .container {
      padding: 60px 40px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    p {
      color: #aaa;
      margin-bottom: 40px;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 30px;
      width: 260px;
    }

    .card h2 {
      font-size: 40px;
      margin-bottom: 10px;
      color: #a855f7;
    }

    .card span {
      color: #888;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">EventosQR</div>

    <button class="logout" onclick="logout()">
      Cerrar sesión
    </button>
  </nav>

  <div class="container">
    <h1>Dashboard</h1>

    <p>Bienvenido al panel de gestión de eventos.</p>

    <div class="cards">

      <div class="card">
        <h2>0</h2>
        <span>Eventos creados</span>
      </div>

      <div class="card">
        <h2>0</h2>
        <span>Entradas vendidas</span>
      </div>

      <div class="card">
        <h2>0</h2>
        <span>Ingresos validados</span>
      </div>

    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }
  </script>

</body>
</html>
