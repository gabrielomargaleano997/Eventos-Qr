<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del evento - EventosQR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #222;
    }

    .logo { font-size: 24px; font-weight: 700; color: #a855f7; }
    .container { padding: 60px 40px; max-width: 700px; }

    .badge {
      background: #a855f720;
      color: #a855f7;
      border: 1px solid #a855f7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 20px;
    }

    h1 { font-size: 42px; margin-bottom: 24px; }

    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .info-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .info-item label {
      color: #888;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
    }

    .info-item p { font-size: 16px; }

    .accesos {
      font-size: 48px;
      color: #a855f7;
      font-weight: 700;
    }

    .botones {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-purple {
      background: #a855f7;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 15px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #444;
      padding: 12px 24px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
    }

    .qr-container {
      margin-top: 40px;
      display: none;
      text-align: center;
    }

    .qr-container img {
      border-radius: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">EventosQR</div>
    <a href="/dashboard.html" style="color: #aaa; text-decoration: none;">← Volver al dashboard</a>
  </nav>

  <div class="container">
    <div class="badge">Activo</div>
    <h1 id="nombre">Cargando...</h1>

    <div class="info-grid">
      <div class="info-item">
        <label>📅 Fecha</label>
        <p id="fecha">-</p>
      </div>
      <div class="info-item">
        <label>📍 Ubicación</label>
        <p id="ubicacion">-</p>
      </div>
      <div class="info-item">
        <label>📝 Descripción</label>
        <p id="descripcion">-</p>
      </div>
      <div class="info-item">
        <label>✅ Accesos validados</label>
        <p class="accesos" id="accesos">0</p>
      </div>
    </div>

    <div class="botones">
      <button class="btn-purple" onclick="verQR()">Ver QR</button>
      <button class="btn-outline" onclick="mostrarEditar()">Editar</button>
      <a href="/dashboard.html" class="btn-outline">Volver</a>
    </div>

    <div id="formEditar" style="display:none; margin-top: 32px;">
      <h2 style="margin-bottom: 20px;">Editar evento</h2>
      <div class="info-item" style="margin-bottom: 16px;">
        <label>Nombre</label>
        <input type="text" id="editNombre" style="width:100%; padding:10px; background:#0f0f0f; border:1px solid #333; border-radius:8px; color:white; font-size:15px;">
      </div>
      <div class="info-item" style="margin-bottom: 16px;">
        <label>Fecha</label>
        <input type="date" id="editFecha" style="width:100%; padding:10px; background:#0f0f0f; border:1px solid #333; border-radius:8px; color:white; font-size:15px;">
      </div>
      <div class="info-item" style="margin-bottom: 16px;">
        <label>Ubicación</label>
        <input type="text" id="editUbicacion" style="width:100%; padding:10px; background:#0f0f0f; border:1px solid #333; border-radius:8px; color:white; font-size:15px;">
      </div>
      <div class="info-item" style="margin-bottom: 24px;">
        <label>Descripción</label>
        <textarea id="editDescripcion" rows="3" style="width:100%; padding:10px; background:#0f0f0f; border:1px solid #333; border-radius:8px; color:white; font-size:15px;"></textarea>
      </div>
      <div style="display:flex; gap:12px;">
        <button class="btn-purple" onclick="guardarEdicion()">Guardar cambios</button>
        <button class="btn-outline" onclick="document.getElementById('formEditar').style.display='none'">Cancelar</button>
      </div>
      <div id="mensajeEditar" style="margin-top:16px; padding:12px; border-radius:8px; display:none;"></div>
    </div>

    <div class="qr-container" id="qrContainer">
      <p style="color: #aaa;">Escaneá este QR para validar el acceso</p>
      <img id="qrImg" src="" alt="QR del evento">
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const params = new URLSearchParams(window.location.search);
    const eventoId = params.get('id');

    let eventoActual = null;

    async function cargarEvento() {
      const response = await fetch('/api/events', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const eventos = await response.json();
      const evento = eventos.find(e => e.id == eventoId);
      eventoActual = evento;

      if (!evento) {
        alert('Evento no encontrado');
        window.location.href = '/dashboard.html';
        return;
      }

      document.getElementById('nombre').textContent = evento.name;
      document.getElementById('fecha').textContent = new Date(evento.date).toLocaleDateString('es-AR');
      document.getElementById('ubicacion').textContent = evento.location || 'No especificada';
      document.getElementById('descripcion').textContent = evento.description || 'Sin descripción';
      document.getElementById('accesos').textContent = evento.accesos || 0;
    }

    function mostrarEditar() {
      document.getElementById('editNombre').value = eventoActual.name;
      document.getElementById('editFecha').value = eventoActual.date.split('T')[0];
      document.getElementById('editUbicacion').value = eventoActual.location || '';
      document.getElementById('editDescripcion').value = eventoActual.description || '';
      document.getElementById('formEditar').style.display = 'block';
    }

    async function guardarEdicion() {
      const data = {
        name: document.getElementById('editNombre').value,
        date: document.getElementById('editFecha').value,
        location: document.getElementById('editUbicacion').value,
        description: document.getElementById('editDescripcion').value
      };

      try {
        const response = await fetch(`/api/events/${eventoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        const msg = document.getElementById('mensajeEditar');

        if (response.ok) {
          msg.style.display = 'block';
          msg.style.background = '#1a4a1a';
          msg.style.border = '1px solid #2a6a2a';
          msg.innerHTML = '✅ Evento actualizado';
          cargarEvento();
          setTimeout(() => {
            msg.style.display = 'none';
            document.getElementById('formEditar').style.display = 'none';
          }, 2000);
        } else {
          msg.style.display = 'block';
          msg.style.background = '#4a1a1a';
          msg.innerHTML = '❌ ' + (result.error || 'Error al actualizar');
        }
      } catch (error) {
        alert('Error de conexión');
      }
    }

    async function verQR() {
      const response = await fetch(`/api/events/${eventoId}/qr`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      document.getElementById('qrImg').src = data.qr;
      document.getElementById('qrContainer').style.display = 'block';
    }

    cargarEvento();
  </script>

</body>
</html>
