<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Detalle del evento - EventosQR</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			font-family: 'Segoe UI', sans-serif;
			background: #0f0f0f;
			color: white;
		}

		nav {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 20px 40px;
			border-bottom: 1px solid #222;
		}

		.logo { font-size: 24px; font-weight: 700; color: #a855f7; }

		.container { padding: 60px 40px; max-width: 700px; }

		.badge {
			background: #a855f720;
			color: #a855f7;
			border: 1px solid #a855f7;
			padding: 6px 14px;
			border-radius: 20px;
			font-size: 13px;
			display: inline-block;
			margin-bottom: 20px;
		}

		h1 { font-size: 42px; margin-bottom: 24px; }

		.info-grid {
			display: flex;
			flex-direction: column;
			gap: 16px;
			margin-bottom: 40px;
		}

		.info-item {
			background: #1a1a1a;
			border: 1px solid #2a2a2a;
			border-radius: 12px;
			padding: 20px 24px;
		}

		.info-item label {
			color: #888;
			font-size: 13px;
			display: block;
			margin-bottom: 6px;
		}

		.info-item p { font-size: 16px; }

		.accesos {
			font-size: 48px;
			color: #a855f7;
			font-weight: 700;
		}

		.botones {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
		}

		.btn-purple {
			background: #a855f7;
			border: none;
			padding: 12px 24px;
			border-radius: 8px;
			color: white;
			cursor: pointer;
			font-weight: bold;
			text-decoration: none;
			font-size: 15px;
		}

		.btn-outline {
			background: transparent;
			border: 1px solid #444;
			padding: 12px 24px;
			border-radius: 8px;
			color: white;
			cursor: pointer;
			font-size: 15px;
			text-decoration: none;
		}

		.qr-container {
			margin-top: 40px;
			display: none;
			text-align: center;
		}

		.qr-container img {
			border-radius: 12px;
			margin-top: 16px;
		}
	</style>
</head>
<body>

	<nav>
		<div class="logo">EventosQR</div>
		<a href="/dashboard.html" style="color: #aaa; text-decoration: none;">← Volver al dashboard</a>
	</nav>

	<div class="container">
		<div class="badge">Activo</div>
		<h1 id="nombre">Cargando...</h1>

		<div class="info-grid">
			<div class="info-item">
				<label>📅 Fecha</label>
				<p id="fecha">-</p>
			</div>
			<div class="info-item">
				<label>📍 Ubicación</label>
				<p id="ubicacion">-</p>
			</div>
			<div class="info-item">
				<label>📝 Descripción</label>
				<p id="descripcion">-</p>
			</div>
			<div class="info-item">
				<label>✅ Accesos validados</label>
				<p class="accesos" id="accesos">0</p>
			</div>
		</div>

		<div class="botones">
			<button class="btn-purple" onclick="verQR()">Ver QR</button>
			<a href="/dashboard.html" class="btn-outline">Volver</a>
		</div>

		<div class="qr-container" id="qrContainer">
			<p style="color: #aaa;">Escaneá este QR para validar el acceso</p>
			<img id="qrImg" src="" alt="QR del evento">
		</div>
	</div>

	<script>
		const token = localStorage.getItem('token');
		if (!token) window.location.href = '/login.html';

		const params = new URLSearchParams(window.location.search);
		const eventoId = params.get('id');

		async function cargarEvento() {
			const response = await fetch('/api/events', {
				headers: { 'Authorization': `Bearer ${token}` }
			});
			const eventos = await response.json();
			const evento = eventos.find(e => e.id == eventoId);

			if (!evento) {
				alert('Evento no encontrado');
				window.location.href = '/dashboard.html';
				return;
			}

			document.getElementById('nombre').textContent = evento.name;
			document.getElementById('fecha').textContent = new Date(evento.date).toLocaleDateString('es-AR');
			document.getElementById('ubicacion').textContent = evento.location || 'No especificada';
			document.getElementById('descripcion').textContent = evento.description || 'Sin descripción';
			document.getElementById('accesos').textContent = evento.accesos || 0;
		}

		async function verQR() {
			const response = await fetch(`/api/events/${eventoId}/qr`, {
				headers: { 'Authorization': `Bearer ${token}` }
			});
			const data = await response.json();
			document.getElementById('qrImg').src = data.qr;
			document.getElementById('qrContainer').style.display = 'block';
		}

		cargarEvento();
	</script>

</body>
</html>
